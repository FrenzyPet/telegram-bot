name: CI/CD Docker Deploy (simple .tar)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: telegram-bot
  IMAGE_TAG: latest

jobs:
  init_check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test imports
        run: |
          python -c "import telebot; from dotenv import load_dotenv; print('All imports successful')"

      - name: Syntax check
        run: |
          python -m py_compile bot.py
          echo "✅ Syntax is correct"

  deploy:
    runs-on: ubuntu-latest
    needs: init_check
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Save Docker image to tar
        run: |
          docker save $IMAGE_NAME:$IMAGE_TAG -o telegram-bot.tar
          chmod 644 telegram-bot.tar

      - name: Upload image tar to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: telegram-bot.tar
          target: /home/${{ secrets.SERVER_USER }}/projects/telegram-bot/

      - name: Upload docker-compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: 'docker-compose.prod.yml'
          target: /home/${{ secrets.SERVER_USER }}/projects/telegram-bot/

      - name: Deploy on server (docker-compose)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail

            DEPLOY_USER="${{ secrets.SERVER_USER }}"
            DEPLOY_DIR="/home/${DEPLOY_USER}/projects/telegram-bot"
            TAR_FILE="${DEPLOY_DIR}/telegram-bot.tar"

            cd "${DEPLOY_DIR}"

            echo "Stopping old containers"
            docker-compose -f docker-compose.prod.yml down || true

            echo "Loading bot image from tar"
            docker load -i "${TAR_FILE}"

            echo "Writing .env for docker-compose"

            echo "🪄 Writing .env file line by line..."
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env
            echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env

            chmod 600 .env

            echo "Starting with docker-compose"
            docker-compose -f docker-compose.prod.yml up -d

            echo "Deployment complete!"
            docker-compose -f docker-compose.prod.yml ps
