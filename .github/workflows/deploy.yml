name: tg bot CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: telegram-bot
  IMAGE_TAG: latest

jobs:
  init_check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test imports
        run: |
          python -c "import telebot; from dotenv import load_dotenv; print('All imports successful')"

      - name: Syntax check
        run: |
          python -m py_compile bot.py
          echo "✅ Syntax is correct"

  deploy:
    runs-on: ubuntu-latest
    needs: init_check
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/projects/telegram-bot

            git pull origin main
            cd /home/${{ secrets.SERVER_USER }}/projects/telegram-bot

            git pull origin main

            echo "🪄 Writing .env file line by line..."
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env
            echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env


            echo "Stopping old containers"
            docker compose -f docker-compose.prod.yml down || true

            echo "Starting with docker compose"
            docker compose -f docker-compose.prod.yml up -d --build

            echo "Deployment complete!"
